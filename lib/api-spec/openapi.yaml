openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conferences
    description: Conference management
  - name: sessions
    description: Conference sessions
  - name: speakers
    description: Conference speakers
  - name: sponsors
    description: Conference sponsors
  - name: push
    description: Push notifications
  - name: voting
    description: Voting management
  - name: admin
    description: Admin operations
  - name: storage
    description: Object storage operations
  - name: community
    description: Conference-scoped community features

paths:
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for direct file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned URL and normalized object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "500":
          description: Failed to generate upload URL

  /storage/objects/{objectPath}:
    get:
      operationId: getConferencePhotoObject
      tags: [storage]
      summary: Fetch a conference photo object
      description: The conference must be provided by X-Conference-Id or the conferenceId query parameter. Admins may include X-Admin-Pin to inspect hidden photos.
      parameters:
        - name: objectPath
          in: path
          required: true
          description: Object path below /objects/ (may contain slash-separated path segments)
          schema: { type: string }
        - name: conferenceId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
        - name: X-Conference-Id
          in: header
          required: false
          schema: { type: integer, minimum: 1 }
        - name: X-Admin-Pin
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Photo image
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          description: Conference ID missing or invalid
        "404":
          description: Object is unavailable

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/verify:
    post:
      operationId: verifyAdmin
      tags: [admin]
      summary: Sign in an operator with the admin PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPinInput"
      responses:
        "200":
          description: PIN verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerifyResult"
        "401":
          description: Invalid PIN

  /conferences:
    get:
      operationId: listConferences
      tags: [conferences]
      summary: List all conferences
      parameters:
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conference list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConferenceList"
        "401":
          description: Unauthorized
    post:
      operationId: createConference
      tags: [conferences]
      summary: Create a conference
      parameters:
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConferenceInput"
      responses:
        "201":
          description: Created conference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConferenceRow"
        "401":
          description: Unauthorized

  /conferences/{id}/config:
    get:
      operationId: getConferenceConfig
      tags: [conferences]
      summary: Get conference config
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conference config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConferenceConfig"
        "404":
          description: Not found

  /conferences/{id}:
    patch:
      operationId: updateConference
      tags: [conferences]
      summary: Update conference settings and branding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConferenceUpdate"
      responses:
        "200":
          description: Updated conference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConferenceRow"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /conferences/{id}/clone:
    post:
      operationId: cloneConference
      tags: [conferences]
      summary: Clone a conference and its structural data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConferenceCloneInput"
      responses:
        "201":
          description: Cloned conference result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConferenceCloneResult"
        "401":
          description: Unauthorized

  /conferences/{id}/speakers:
    get:
      operationId: listConferenceSpeakers
      tags: [speakers]
      summary: List speakers for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Speakers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerList"
        "401":
          description: Unauthorized

  /conferences/{id}/speakers/bulk:
    post:
      operationId: bulkImportSpeakers
      tags: [speakers]
      summary: Bulk import speakers for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerBulkInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "401":
          description: Unauthorized

  /conferences/{id}/speakers/{speakerId}:
    patch:
      operationId: updateConferenceSpeaker
      tags: [speakers]
      summary: Edit one speaker
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: speakerId
          in: path
          required: true
          schema: { type: integer }
        - name: X-Admin-Pin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerUpdate"
      responses:
        "200":
          description: Updated speaker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Speaker"
        "400":
          description: Invalid update
        "401":
          description: Unauthorized
        "404":
          description: Speaker not found in conference

  /conferences/{id}/sessions:
    get:
      operationId: listConferenceSessions
      tags: [sessions]
      summary: List sessions for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          description: Unauthorized

  /conferences/{id}/sessions/bulk:
    post:
      operationId: bulkImportSessions
      tags: [sessions]
      summary: Bulk import sessions for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionBulkInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "401":
          description: Unauthorized

  /conferences/{id}/sessions/{sessionId}:
    patch:
      operationId: updateConferenceSession
      tags: [sessions]
      summary: Edit one session
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - name: X-Admin-Pin
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid update
        "401":
          description: Unauthorized
        "404":
          description: Session not found in conference

  /conferences/{id}/sponsors:
    get:
      operationId: listConferenceSponsors
      tags: [sponsors]
      summary: List sponsors for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sponsors list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorList"
        "401":
          description: Unauthorized

  /conferences/{id}/sponsors/bulk:
    post:
      operationId: bulkImportSponsors
      tags: [sponsors]
      summary: Bulk import sponsors for a conference
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorBulkInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "401":
          description: Unauthorized

  /push/send:
    post:
      operationId: sendPushNotification
      tags: [push]
      summary: Send a push notification to all registered devices
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushNotificationInput"
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSendResult"
        "401":
          description: Unauthorized

  /push/stats:
    get:
      operationId: getPushStats
      tags: [push]
      summary: Get registered device count
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Push stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStats"

  /voting/state:
    get:
      operationId: getVotingState
      tags: [voting]
      summary: Get voting open/closed state
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotingState"

  /voting/results:
    get:
      operationId: getVotingResults
      tags: [voting]
      summary: Get voting results (admin only)
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Voting results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotingResults"
        "401":
          description: Unauthorized

  /voting/open:
    post:
      operationId: openVoting
      tags: [voting]
      summary: Open voting for a conference
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotingActionResult"
        "401":
          description: Unauthorized

  /voting/close:
    post:
      operationId: closeVoting
      tags: [voting]
      summary: Close voting for a conference
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotingActionResult"
        "401":
          description: Unauthorized

  /voting/reset:
    post:
      operationId: resetVoting
      tags: [voting]
      summary: Reset all votes for a conference
      parameters:
        - name: X-Conference-Id
          in: header
          required: true
          schema:
            type: integer
        - name: X-Admin-Pin
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VotingActionResult"
        "401":
          description: Unauthorized

  /community/profile:
    post:
      operationId: saveCommunityProfile
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityProfileInput"
      responses:
        "200":
          description: Saved community profile
          content:
            application/json:
              schema:
                type: object
                required: [name, restricted]
                properties:
                  name: { type: string }
                  restricted: { type: boolean }

  /community/discussions:
    get:
      operationId: listCommunityDiscussions
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/CommunitySessionToken"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Discussions
          content:
            application/json:
              schema:
                type: object
                required: [discussions]
                properties:
                  discussions:
                    type: array
                    items: { $ref: "#/components/schemas/CommunityDiscussion" }
    post:
      operationId: createCommunityDiscussion
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityDiscussionInput" }
      responses:
        "201":
          description: Created discussion
          content:
            application/json:
              schema:
                type: object
                required: [discussion]
                properties:
                  discussion: { $ref: "#/components/schemas/CommunityDiscussion" }

  /community/discussions/{id}:
    get:
      operationId: getCommunityDiscussion
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/CommunitySessionToken"
      responses:
        "200":
          description: Discussion with replies
          content:
            application/json:
              schema:
                type: object
                required: [discussion]
                properties:
                  discussion:
                    allOf:
                      - $ref: "#/components/schemas/CommunityDiscussion"
                      - type: object
                        required: [canDelete, replies]
                        properties:
                          canDelete: { type: boolean }
                          replies:
                            type: array
                            items: { $ref: "#/components/schemas/CommunityComment" }
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }

  /community/discussions/{id}/replies:
    post:
      operationId: createCommunityReply
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityTextInput" }
      responses:
        "201":
          description: Created reply
          content:
            application/json:
              schema:
                type: object
                required: [reply]
                properties:
                  reply: { $ref: "#/components/schemas/CommunityComment" }

  /community/photos/{id}/comments:
    get:
      operationId: listPhotoComments
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/CommunitySessionToken"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Photo comments
          content:
            application/json:
              schema:
                type: object
                required: [comments]
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/CommunityComment" }
    post:
      operationId: createPhotoComment
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityTextInput" }
      responses:
        "201":
          description: Created photo comment
          content:
            application/json:
              schema:
                type: object
                required: [comment]
                properties:
                  comment: { $ref: "#/components/schemas/CommunityComment" }

  /community/{type}/{id}:
    delete:
      operationId: deleteCommunityContent
      tags: [community]
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [comment, reply, discussion] }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityDeleteInput"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunitySuccess" }

  /community/reports:
    post:
      operationId: reportCommunityContent
      tags: [community]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommunityReportInput" }
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunitySuccess" }

  /community/leaderboard:
    get:
      operationId: getCommunityLeaderboard
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/CommunitySessionToken"
      responses:
        "200":
          description: Conference leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityLeaderboard" }

  /community/admin:
    get:
      operationId: getCommunityAdminData
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
      responses:
        "200":
          description: Community moderation data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityAdminData" }

  /community/admin/leaderboard:
    get:
      operationId: exportCommunityLeaderboard
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
      responses:
        "200":
          description: Full conference leaderboard export
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityLeaderboardExport" }

  /community/admin/actions:
    get:
      operationId: listCommunityAdminActions
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
        - name: before
          in: query
          schema: { type: integer, minimum: 1 }
          description: Load decisions older than this action ID
      responses:
        "200":
          description: Most recent 50 decisions for this conference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunityAdminActionPage" }

  /community/admin/actions/export:
    get:
      operationId: exportCommunityAdminActions
      tags: [community]
      summary: Export all recorded community decisions for this conference
      parameters:
        - $ref: "#/components/parameters/AdminPin"
      responses:
        "200":
          description: CSV decision history with action time, target, states, reason, and actor label
          content:
            text/csv:
              schema: { type: string, format: binary }
        "403":
          description: Invalid admin PIN

  /community/admin/content:
    patch:
      operationId: updateCommunityContentVisibility
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
        - $ref: "#/components/parameters/OperatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityVisibilityInput"
      responses:
        "200":
          description: Updated visibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunitySuccess" }

  /community/admin/users:
    patch:
      operationId: updateCommunityUserRestriction
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
        - $ref: "#/components/parameters/OperatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityRestrictionInput"
      responses:
        "200":
          description: Updated restriction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunitySuccess" }

  /community/admin/reports/{id}:
    patch:
      operationId: updateCommunityReport
      tags: [community]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - $ref: "#/components/parameters/AdminPin"
        - $ref: "#/components/parameters/OperatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportStatusInput"
      responses:
        "200":
          description: Updated report status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommunitySuccess" }

  /community/admin/settings:
    patch:
      operationId: updateCommunitySettings
      tags: [community]
      parameters:
        - $ref: "#/components/parameters/AdminPin"
        - $ref: "#/components/parameters/OperatorSession"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunitySettingsInput"
      responses:
        "200":
          description: Updated leaderboard cutoff
          content:
            application/json:
              schema:
                type: object
                required: [cutoffAt]
                properties:
                  cutoffAt: { type: [string, "null"], format: date-time }

components:
  parameters:
    OperatorSession:
      name: X-Operator-Session
      in: header
      required: true
      description: Server-signed named operator session returned by admin sign-in; expires after 12 hours. A PIN alone cannot authorize community decisions.
      schema: { type: string }
    CommunitySessionToken:
      name: sessionToken
      in: query
      required: true
      schema: { type: string }
    AdminPin:
      name: X-Admin-Pin
      in: header
      required: true
      schema: { type: string }
  schemas:
    CommunityProfileInput:
      type: object
      required: [sessionToken, name]
      properties:
        sessionToken: { type: string }
        name: { type: string, minLength: 1, maxLength: 50 }

    CommunityTextInput:
      type: object
