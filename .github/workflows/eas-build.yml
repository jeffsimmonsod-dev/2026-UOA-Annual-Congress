name: EAS Build

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/conference-app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android (Play Store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        working-directory: artifacts/conference-app
        run: pnpm install

      - name: Build Android AAB
        working-directory: artifacts/conference-app
        run: pnpm exec eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
